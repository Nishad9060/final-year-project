m":"8px","margin-desktop":"32px","lg":"24px","md":"16px"},"fontFamily":{"score-display":["Inter"],"headline-md":["Inter"],"headline-lg":["Inter"],"label-caps":["Inter"],"score-display-mobile":["Inter"],"body-md":["Inter"],"data-tabular":["Inter"],"body-lg":["Inter"]},"fontSize":{"score-display":["48px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"400px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-caps":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"score-display-mobile":["36px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"data-tabular":["14px",{"lineHeight":"20px","fontWeight":"500"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}]}}}}</script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface"><main class="w-full min-h-screen flex flex-col items-center justify-center p-margin-mobile"><div class="flex flex-col w-full min-h-screen justify-center items-center relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 flex justify-center items-center">
<svg class="w-[800px] h-[800px] text-primary" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path d="M47.7,-57.2C59.5,-47.3,65.3,-30.3,68.5,-12.9C71.7,4.5,72.2,22.2,64,35.4C55.7,48.5,38.7,57,21.5,60.8C4.3,64.6,-13.1,63.7,-29.4,57.1C-45.7,50.6,-60.8,38.3,-68.2,21.9C-75.6,5.5,-75.2,-15,-66.3,-31.2C-57.4,-47.4,-40,-59.3,-23.5,-63.9C-6.9,-68.5,8.7,-65.8,24,-61Z" fill="currentColor" transform="translate(100 100) scale(1.1)">
<animatetransform attributename="transform" dur="60s" from="0 100 100" repeatcount="indefinite" to="360 100 100" type="rotate"></animatetransform>
</path>
</svg>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md bg-surface-container rounded-xl shadow-2xl p-lg flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col items-center gap-sm text-center mb-md">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center shadow-lg mb-sm">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">sports_soccer</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Footonomy</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your tactical companion</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md w-full" id="loginForm">
<!-- Email Field -->
<div class="flex flex-col gap-xs group">
<label class="font-label-caps text-label-caps text-on-surface-variant group-focus-within:text-primary transition-colors" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-high text-on-surface font-body-md text-body-md rounded-lg py-md pl-[48px] pr-md outline-none focus:ring-2 focus:ring-primary transition-all shadow-inner placeholder:text-on-surface-variant/50" id="email" placeholder="manager@club.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs group">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant group-focus-within:text-primary transition-colors" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-high text-on-surface font-body-md text-body-md rounded-lg py-md pl-[48px] pr-md outline-none focus:ring-2 focus:ring-primary transition-all shadow-inner placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-primary-container text-on-primary-container font-headline-md text-[18px] py-md rounded-lg shadow-md hover:bg-inverse-primary hover:shadow-lg transition-all active:scale-[0.98] flex justify-center items-center gap-sm relative overflow-hidden group" type="submit">
<span class="relative z-10">Sign In</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</form>
<!-- Footer -->
<div class="text-center mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary hover:text-primary-fixed font-data-tabular text-data-tabular ml-xs transition-colors underline decoration-primary/30 underline-offset-4 hover:decoration-primary" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');
        
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
            btn.style.pointerEvents = 'none';
            
            // Simulate network request
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.pointerEvents = 'auto';
                // Add success visual feedback
                btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
                setTimeout(() => {
                    btn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
                }, 1000);
            }, 1500);
        });
    });
</script></main></body></html>
