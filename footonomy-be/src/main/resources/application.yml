spring:
  application:
    name: footonomy-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/footonomy_db}
    username: ${DB_USERNAME:footonomy}
    password: ${DB_PASSWORD:footonomy}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # Comma-separated list of origins allowed to call the API (the frontend's dev/deployed URL).
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Must be set via env var in every real environment; this default only exists so local
    # first-run doesn't hard-crash before the developer has read SETUP.md.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-use-01234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

football-data:
  api:
    base-url: ${FOOTBALL_DATA_BASE_URL:https://api.football-data.org/v4}
    token: ${FOOTBALL_DATA_API_TOKEN:}
  sync:
    # Free tier cap is 10 req/min; this interval + the request budget in FootballDataSyncJob
    # are what keep us under it. Do not lower without re-checking that budget.
    fixed-delay-ms: ${FOOTBALL_DATA_SYNC_INTERVAL_MS:420000}
    enabled: ${FOOTBALL_DATA_SYNC_ENABLED:true}

logging:
  level:
    com.footonomy: INFO
