spring:
  datasource:
    url: jdbc:h2:mem:footonomy_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-secret-not-for-real-use-0123456789012345678901234567890
    expiration-ms: 3600000

football-data:
  sync:
    enabled: false
